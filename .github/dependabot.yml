version: 2

updates:
  # Rails 側の gem。ワーカーは stdlib だけで書いてあるので、ここが依存の全部になる
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # 個別に PR が立つと読む手間だけ増える。壊れうるものだけ分ける
      minor-and-patch:
        update-types:
          - minor
          - patch

  # esbuild と Hotwire
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Dockerfile の ruby イメージ（ARG RUBY_VERSION）
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types:
          - minor
          - patch
