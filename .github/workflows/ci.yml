name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# corepack reads the yarn version out of package.json's packageManager and
# fetches it on first use. Without this it stops to ask, and a job with no one
# to answer hangs
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      # herb lint runs the linter from node_modules, pinned there and in .herb.yml
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn install --immutable

      # HTML-aware, so it sees what RuboCop cannot: unclosed tags, output in
      # attribute position, branches that repeat the same element
      - name: Lint templates
        run: bundle exec herb lint "app/views/**/*.html.erb"

  worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      # Guarantees the worker can be required without Rails. On a development
      # machine it loads anyway by way of Rails, which is why an ActiveSupport
      # extension slipping in is not something human review catches
      - name: Load the worker without Rails
        run: ruby -Ilib -I. -e 'require "worker/runner"'

      - name: Run worker unit tests
        run: ruby -Ilib -I. -e 'Dir["worker/test/*_test.rb"].each { |f| require File.expand_path(f) }'

      # The only test that actually drives docker. It watches that --network none
      # holds, and that statistics come back from the cgroup
      - name: Run the docker end-to-end test
        env:
          MCP_CODERUNNER_APP_E2E: "1"
        run: ruby -Ilib -I. worker/test/e2e_test.rb

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips node-gyp

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      # The tests build the JavaScript through jsbundling, which shells out to
      # yarn. The runner ships Yarn 1, which cannot read a Yarn 4 lockfile
      - name: Enable corepack
        run: corepack enable

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips node-gyp

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Only what landed on main, and only once every job above has passed.
  # ssh to the VPS is opkssh: no long-lived key anywhere, just the GitHub Actions
  # OIDC token
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ scan_ruby, lint, worker, test, system-test ]
    runs-on: ubuntu-latest

    # What deployment needs lives in this environment's secrets.
    # Declaring an environment also makes the OIDC token's sub
    # repo:<owner>/<repo>:environment:production, which is what opkssh's auth_id matches
    environment: production

    # Never two at once, and whatever is already running is left to finish
    concurrency:
      group: deploy
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write   # to push to ghcr.io
      id-token: write   # the OIDC token opkssh uses

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      MCP_CODERUNNER_APP_BASE_URL: ${{ secrets.MCP_CODERUNNER_APP_BASE_URL }}
      BOOTSTRAP_ADMIN_GITHUB_LOGIN: ${{ secrets.BOOTSTRAP_ADMIN_GITHUB_LOGIN }}
      # A secret's name cannot start with GITHUB_, so they are copied across from another name
      GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      # Web Push. Unset simply means the feature is not there
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      # Both the push and the pull run on a token valid only for this job's lifetime
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up opkssh
        uses: openpubkey/setup-opkssh@8a886955db9d3e3d58f322b342da0f20c49a5253 # v2
        with:
          ssh-hosts-to-scan: ${{ secrets.DEPLOY_HOST }}

      # Kamal connects through net-ssh, which does not always pick up the certificate
      # unless it comes by way of an agent, so the key opkssh wrote is added explicitly
      - name: Hand the opkssh certificate to an agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          for key in ~/.ssh/id_*; do
            case "$key" in *.pub) continue ;; esac
            ssh-add "$key" || true
          done
          ssh-add -l

      # .kamal/secrets reads config/master.key from the checkout. CI has none, so write it
      - name: Write the master key
        run: |
          install -m 600 /dev/null config/master.key
          printf '%s' "${{ secrets.RAILS_MASTER_KEY }}" > config/master.key

      - name: Check the resolved configuration
        run: bin/kamal config

      - name: Deploy
        run: bin/kamal deploy
