name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Rails を読まずに require できることを保証する。開発機では Rails 経由で
      # 通ってしまうので、ActiveSupport の混入は人間のレビューでは捕まえられない
      - name: Load the worker without Rails
        run: ruby -Ilib -I. -e 'require "worker/runner"'

      - name: Run worker unit tests
        run: ruby -Ilib -I. -e 'Dir["worker/test/*_test.rb"].each { |f| require File.expand_path(f) }'

      # 実際に docker を回す唯一のテスト。--network none が効いていることと、
      # cgroup から統計が取れることを見る
      - name: Run the docker end-to-end test
        env:
          MCP_CODERUNNER_APP_E2E: "1"
        run: ruby -Ilib -I. worker/test/e2e_test.rb

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips node-gyp

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips node-gyp

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # main に入ったものだけを、上のジョブが全部通ってからデプロイする。
  # VPS への ssh は opkssh。長命の鍵を置かず、GitHub Actions の OIDC で入る
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ scan_ruby, lint, worker, test, system-test ]
    runs-on: ubuntu-latest

    # デプロイに使う値はこの environment の secret に入れてある。
    # environment を宣言すると OIDC トークンの sub も
    # repo:<owner>/<repo>:environment:production になる（opkssh の auth_id と揃える）
    environment: production

    # 同時に 2 本走らせない。走っている分は最後まで流す
    concurrency:
      group: deploy
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write   # ghcr.io へ push する
      id-token: write   # opkssh が使う OIDC トークン

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      MCP_CODERUNNER_APP_BASE_URL: ${{ secrets.MCP_CODERUNNER_APP_BASE_URL }}
      BOOTSTRAP_ADMIN_GITHUB_LOGIN: ${{ secrets.BOOTSTRAP_ADMIN_GITHUB_LOGIN }}
      # GITHUB_ で始まる名前の secret は作れないので、別名から移し替える
      GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      # push も pull もこのジョブの寿命だけ有効なトークンで済ませる
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up opkssh
        uses: openpubkey/setup-opkssh@v2
        with:
          ssh-hosts-to-scan: ${{ secrets.DEPLOY_HOST }}

      # Kamal は net-ssh で繋ぐ。証明書は agent 経由でないと拾われないことがあるので、
      # opkssh が書いた鍵を明示的に読ませる
      - name: Hand the opkssh certificate to an agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          for key in ~/.ssh/id_*; do
            case "$key" in *.pub) continue ;; esac
            ssh-add "$key" || true
          done
          ssh-add -l

      # .kamal/secrets は手元の config/master.key を読む。CI には無いので置く
      - name: Write the master key
        run: |
          install -m 600 /dev/null config/master.key
          printf '%s' "${{ secrets.RAILS_MASTER_KEY }}" > config/master.key

      - name: Check the resolved configuration
        run: bin/kamal config

      - name: Deploy
        run: bin/kamal deploy
