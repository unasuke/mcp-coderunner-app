# Name of your application. Used to uniquely configure containers.
service: mcp_coderunner_app

# Name of the container image. ghcr.io requires the owner in the name.
image: unasuke/mcp-coderunner-app

# Deploy to these servers.
# The real address is not in this repository. CI passes it from a secret.
servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    # An existing Caddy owns 80/443, so kamal-proxy is not used. Turning it off is
    # said at the role level (a top-level proxy: configures the proxy itself)
    proxy: false
    options:
      publish: [ "127.0.0.1:7000:80" ]
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# The container publishes to a fixed port on localhost, and Caddy picks it up with
# reverse_proxy localhost:7000. Certificates are left to Caddy's automatic HTTPS
# （deploy/Caddyfile.example）。

# The image is built locally or in CI and pushed; the server only pulls.
# Nothing is built on the VPS.
# From CI the throwaway GITHUB_TOKEN is passed; from a laptop, your own PAT
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "unasuke") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - GITHUB_CLIENT_SECRET
  clear:
    # The hostname and the login name are not in this repository either. CI passes them from secrets
    MCP_CODERUNNER_APP_BASE_URL: <%= ENV.fetch("MCP_CODERUNNER_APP_BASE_URL") %>
    GITHUB_CLIENT_ID: <%= ENV.fetch("GITHUB_CLIENT_ID") %>
    BOOTSTRAP_ADMIN_GITHUB_LOGIN: <%= ENV.fetch("BOOTSTRAP_ADMIN_GITHUB_LOGIN") %>

    # A worker holds one thread for a 25-second long poll. Leave room for the number
    # of worker instances, plus the browser and MCP
    RAILS_MAX_THREADS: 8

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use mcp_coderunner_app-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "mcp_coderunner_app_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.6
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Matches whichever Linux user opkssh's auth_id maps to
ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "root") %>

