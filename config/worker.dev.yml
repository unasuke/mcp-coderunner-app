# The worker configuration for development, started by bin/dev.
# bin/rails mcp_coderunner_app:worker:dev_token puts the token in tmp/worker_token.
worker_id: dev
endpoint: http://localhost:3000
token_file: tmp/worker_token

# Uses tmp inside the repository (already gitignored). It becomes absolute before docker sees it
runtime_dir: tmp/mcp-coderunner-app

limits:
  max_concurrency: 1

build:
  cache_ttl_days: 14
  max_images: 20
