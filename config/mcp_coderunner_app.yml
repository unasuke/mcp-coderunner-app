# Rails 側だけの値。両方が知っていないと壊れる値（lease の窓、heartbeat の間隔、
# プロファイル定義、protocol_version）は lib/protocol の定数にある。
shared:
  # review_url を組み立てるのに使う
  base_url: http://localhost:3000

  # script はこれを超えると pending_review、その上を超えると submit_job がエラー
  script_review_bytes: 65536
  script_max_bytes: 262144

  # Blueprint の context
  dockerfile_max_bytes: 65536
  context_max_bytes: 1048576
  max_context_files: 50

  # list_blueprints が返す件数
  blueprint_list_limit: 50

  # 保持期間（日）
  refresh_token_retention_days: 30
  result_retention_days: 30
  script_retention_days: 90
  process_retention_days: 30
  lease_retention_days: 30

  # 最初のログインで admin になる GitHub のログイン名。どの環境でも環境変数から読む
  bootstrap_admin_login: <%= ENV["BOOTSTRAP_ADMIN_GITHUB_LOGIN"] %>

  # ワーカーとのずれを検知するための実装のリビジョン
  commit_hash: development

  # GitHub ログイン。read:user だけ要求する
  github_client_id: <%= ENV["GITHUB_CLIENT_ID"] %>
  github_client_secret: <%= ENV["GITHUB_CLIENT_SECRET"] %>

  # GitHub を経由せずにログインできる開発用の口。
  # これは認可の中心（member 以上のセッションからしか認可コードを出さない）を
  # 迂回する。**本番で true にしない。** 有効な環境では /auth/developer が生える
  allow_developer_login: false

# config_for が shared を各環境にマージする
development:
  allow_developer_login: true
  # 開発用ログインで dev と入れると admin になる。環境変数があればそちらが優先される
  bootstrap_admin_login: <%= ENV.fetch("BOOTSTRAP_ADMIN_GITHUB_LOGIN", "dev") %>

test:
  base_url: http://mcp-coderunner-app.invalid
  # 実行環境の設定に左右されないよう、テストでは常に未設定から始める
  bootstrap_admin_login: ~
  # 値そのものは使わない。OmniAuth のモックを通すために、ストラテジが
  # 生えている状態を作る（資格情報が無い環境では登録しないため）
  github_client_id: test-client-id
  github_client_secret: test-client-secret

production:
  base_url: <%= ENV.fetch("MCP_CODERUNNER_APP_BASE_URL", "https://mcp-coderunner-app.example.com") %>
  # Kamal がデプロイするリビジョンを渡す。無ければビルド時に埋めた GIT_COMMIT
  commit_hash: <%= ENV["KAMAL_VERSION"] || ENV["GIT_COMMIT"] || "unknown" %>
