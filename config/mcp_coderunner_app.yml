# Values the Rails side owns alone. Anything both sides have to agree on -- the
# lease window, the heartbeat interval, the profile definitions, protocol_version --
# lives in the constants under lib/protocol.
shared:
  # Used to build review_url
  base_url: http://localhost:3000

  # Past the first, a script lands in pending_review; past the second, submit_job errors
  script_review_bytes: 65536
  script_max_bytes: 262144

  # A Blueprint's context
  dockerfile_max_bytes: 65536
  context_max_bytes: 1048576
  max_context_files: 50

  # How many rows list_blueprints returns
  blueprint_list_limit: 50

  # Retention, in days
  refresh_token_retention_days: 30
  result_retention_days: 30
  script_retention_days: 90
  process_retention_days: 30
  lease_retention_days: 30

  # The GitHub login that becomes admin on its first sign-in. Read from the
  # environment in every environment
  bootstrap_admin_login: <%= ENV["BOOTSTRAP_ADMIN_GITHUB_LOGIN"] %>

  # The revision of this implementation, used to spot drift against the worker
  commit_hash: development

  # GitHub sign-in. It asks for read:user and nothing else
  github_client_id: <%= ENV["GITHUB_CLIENT_ID"] %>
  github_client_secret: <%= ENV["GITHUB_CLIENT_SECRET"] %>

  # Web Push. With no keys the feature is simply absent, the same way GitHub
  # sign-in is. Generate the pair once and keep it: replacing it invalidates every
  # subscription that was made against the old one.
  #   bin/rails runner 'k = WebPush.generate_key; puts k.public_key; puts k.private_key'
  vapid_public_key: <%= ENV["VAPID_PUBLIC_KEY"] %>
  vapid_private_key: <%= ENV["VAPID_PRIVATE_KEY"] %>
  # Where a push service reaches the sender if something is wrong. mailto: or https:
  vapid_subject: <%= ENV.fetch("VAPID_SUBJECT", "mailto:noreply@example.com") %>

  # The development door that signs in without going through GitHub.
  # It bypasses the center of the authorization model -- that an authorization code
  # is only issued to a session holding member or above. **Never true in production.**
  # Where it is on, /auth/developer exists
  allow_developer_login: false

# config_for merges shared into each environment
development:
  allow_developer_login: true
  # Entering dev at the developer sign-in lands as admin. An environment variable wins over this
  bootstrap_admin_login: <%= ENV.fetch("BOOTSTRAP_ADMIN_GITHUB_LOGIN", "dev") %>

test:
  base_url: http://mcp-coderunner-app.invalid
  # Tests always start from unset, so nothing depends on how the machine is configured
  bootstrap_admin_login: ~
  # The values themselves go unused. They exist so the strategy is registered and
  # OmniAuth's mock has something to run through (without credentials it is not registered)
  github_client_id: test-client-id
  github_client_secret: test-client-secret

production:
  base_url: <%= ENV.fetch("MCP_CODERUNNER_APP_BASE_URL", "https://mcp-coderunner-app.example.com") %>
  # Kamal passes the revision it deployed. Failing that, the GIT_COMMIT baked in at build time
  commit_hash: <%= ENV["KAMAL_VERSION"] || ENV["GIT_COMMIT"] || "unknown" %>
