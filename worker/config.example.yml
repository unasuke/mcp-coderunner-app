# /etc/mcp-coderunner-app/config.yml
worker_id: home-vm-01
endpoint: https://mcp-coderunner-app.example.com
token_file: /etc/mcp-coderunner-app/token

# The per-job working directory. This is bind-mounted into the container, so it has
# to be somewhere the daemon can see. Not /run: the rootless daemon has a /run of its
# own (rootlesskit --copy-up=/run) and a directory created there afterwards is not in
# it, which leaves the container with an empty /work.
runtime_dir: /var/lib/mcp-coderunner-app/work

# The worker's own source of truth. Anything from the VPS above these is trimmed, then run
limits:
  max_memory_mb: 4096
  max_cpus: 4
  max_pids: 1024
  max_timeout_s: 600
  max_tmpfs_mb: 1024
  max_context_bytes: 1048576
  max_output_bytes: 262144
  max_concurrency: 2

build:
  cache_ttl_days: 14
  max_images: 40
